<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="painel-controle">
        <header>
            <h2>Painel de Controle Interativo</h2>
        </header>
        <section class="controles">
            <button id="btn-acao">Clique Aqui</button>
            <input type="text" id="campo-texto" placeholder="Digite algo...">
        </section>
        <section class="resultados">
            <p id="output-click">Cliques no botão: 0</p>
            <p id="output-mouse">Posição do cursor no painel: X: 0, Y: 0</p>
            <p id="output-tecla">Última tecla pressionada: nenhuma</p>
        </section>
    </main>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</body>
</html>
